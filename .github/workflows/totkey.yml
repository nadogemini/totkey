name: Totkey build

# Totkey: TitanKeys (pinned at UPSTREAM_REF) with the patches in totkey/*.b64 (gzip + base64 git diffs, applied in order),
# built the way TitanKeys builds: with the Ink checkout beside it (../ink at INK_REF) carrying ink/titankeys-themes.patch (TitanKeys' Ink patch merged onto Ink feat/themes).
on:
  push:
    branches: [main]
    paths: ['totkey/**', '.github/workflows/totkey.yml']
  workflow_dispatch:

concurrency:
  group: totkey-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      UPSTREAM_REF: v3.0.3
      INK_REF: 2f00246
      KEYSTORE_DIR: /home/runner/.totkey-keystore
      INK_KEYSTORE_PASSWORD: totkey-keystore
      INK_KEY_PASSWORD: totkey-keystore
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upstream source and Totkey patches
        run: |
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/totkey"
          cp totkey/*.b64* "$RUNNER_TEMP/totkey/"
          cp ink/titankeys-themes.patch "$RUNNER_TEMP/"
          echo "INK_PATCH_HASH=$(sha256sum ink/titankeys-themes.patch | cut -c1-16)" >> "$GITHUB_ENV"
          if ! git rev-parse -q --verify "refs/tags/$UPSTREAM_REF" >/dev/null; then
            git fetch --no-tags https://github.com/jasonlok000/titankeys "refs/tags/$UPSTREAM_REF:refs/tags/$UPSTREAM_REF"
          fi
          git checkout -q -f "$UPSTREAM_REF"
          git clean -q -fdx
          # A patch may be split into parts (incN.b64, incN.b64.0, incN.b64.1 ...): the parts are joined in order.
          for name in $(ls "$RUNNER_TEMP/totkey" | sed -E 's/\.b64(\..*)?$//' | sort -uV); do
            echo "Applying $name"
            cat $(ls "$RUNNER_TEMP/totkey/$name".b64* | sort -V) | tr -d '\n\r ' | base64 -d | gunzip | git apply --whitespace=nowarn
          done
          python3 -c "from PIL import Image" 2>/dev/null || pip install --quiet --break-system-packages pillow
          python3 -c "from PIL import Image; Image.open('android/src/main/res/drawable-nodpi/totkey_dog.png').convert('RGBA').resize((960, 960), Image.NEAREST).save('assets/icon.png')"
          sed -i -E "s/^version = .*/version = \"3.0.3\"/; s/^version_code = .*/version_code = $((1000 + GITHUB_RUN_NUMBER))/" ink.toml
          sed -i -E "s#^keystore = .*#keystore = \"$KEYSTORE_DIR/totkey.p12\"#; s/^key_alias = .*/key_alias = \"totkey\"/" ink.toml
          cat ink.toml

      - name: Ink beside the app, with TitanKeys' Ink patch
        run: |
          git clone -q https://github.com/No-Scrolling/ink ../ink
          git -C ../ink checkout -q "$INK_REF"
          git -C ../ink apply --whitespace=nowarn "$RUNNER_TEMP/titankeys-themes.patch"
          cat ../ink/sdk.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rust, cargo-ndk and the Android SDK parts Ink asks for
        run: |
          sdk=../ink/sdk.json
          rust=$(jq -r .rust $sdk); ndk=$(jq -r .androidNdk $sdk); platform=$(jq -r .androidPlatform $sdk)
          tools=$(jq -r .androidBuildTools $sdk); cargondk=$(jq -r .cargoNdk $sdk)
          rustup toolchain install "$rust" --profile minimal --target aarch64-linux-android
          cargo +"$rust" install cargo-ndk --version "$cargondk" --locked
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            platform-tools "platforms;android-$platform" "build-tools;$tools" "ndk;$ndk" > /dev/null
          echo "BUILD_TOOLS=$tools" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ../ink/target
          key: totkey-ink-${{ env.INK_REF }}-${{ env.INK_PATCH_HASH }}

      - name: Install the app's packages
        run: |
          (cd ../ink && bun install --frozen-lockfile)
          bun install --frozen-lockfile

      - name: Signing key (kept between builds, so updates install over the last one)
        uses: actions/cache@v4
        with:
          path: /home/runner/.totkey-keystore
          key: totkey-keystore-v1

      - name: Build the signed APK
        run: |
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_DIR/totkey.p12" ]; then
            keytool -genkeypair -keystore "$KEYSTORE_DIR/totkey.p12" -storetype PKCS12 -storepass "$INK_KEYSTORE_PASSWORD" \
              -keypass "$INK_KEY_PASSWORD" -alias totkey -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Totkey"
            echo "::notice::New signing key made: uninstall the old Totkey once before installing this build."
          fi
          ../ink/scripts/ink build
          ls -la dist
          apks=(dist/*.apk)
          mkdir -p release
          cp "${apks[0]}" "release/Totkey-${GITHUB_RUN_NUMBER}.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "release/Totkey-${GITHUB_RUN_NUMBER}.apk" | grep -i "SHA-256" | head -1
          cd release && sha256sum *.apk > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: totkey-apk
          path: release/
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="totkey-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$MAIN_SHA" --prerelease \
            --title "Totkey ${GITHUB_RUN_NUMBER}" --notes "Totkey dựa trên TitanKeys ${UPSTREAM_REF}. Bản build số ${GITHUB_RUN_NUMBER}." \
            release/*.apk release/SHA256SUMS
